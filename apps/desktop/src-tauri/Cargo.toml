[package]
name = "local-ai"
version = "0.1.0"
description = "Local Autonomous AI Platform"
authors = ["Claude <noreply@anthropic.com>"]
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "1", features = ["shell-open", "system-tray"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
